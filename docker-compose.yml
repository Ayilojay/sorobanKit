# Every service belongs to a profile, so `docker compose up` on its own starts
# nothing and you always say which stack you want:
#
#   docker compose --profile dev up          backend + postgres + redis
#   docker compose --profile full up         the same, plus the built frontend
#   docker compose --profile test up         API under test + its own database
#   docker compose --profile integration up  local standalone Stellar network
#   docker compose --profile preview up      ephemeral per-PR preview stack
#
# dev and test use separate databases on separate host ports, so both can run
# at once without colliding.
#
# ── Preview environments (one per pull request) ──────────────────────────────
# The preview profile provisions an isolated, throwaway stack for a single PR.
# It is driven by the preview workflow, which MUST set a per-PR project name so
# that every resource (containers, network, volumes) is namespaced and cannot
# collide with another PR or with dev/test:
#
#   COMPOSE_PROJECT_NAME=preview-pr-<number> \
#     docker compose --profile preview up -d --build
#
# The cleanup job targets exactly the same resources by reusing that project
# name, so the two must agree on the naming scheme:
#
#   COMPOSE_PROJECT_NAME=preview-pr-<number> \
#     docker compose --profile preview down -v --remove-orphans
#
# `down -v` removes the named volumes below, which is what makes teardown
# auditable: after it runs, no preview data survives. The cleanup job runs on
# PR close (and on a TTL sweep) and logs the project name it tore down.
#
# TTL: a preview stack is expected to live for at most PREVIEW_TTL_HOURS
# (default 24). The workflow stamps the creation time as a label so the sweep
# can find and remove stacks older than the TTL even if the PR is never closed.
# Nothing here holds production credentials: the preview profile only reads
# PREVIEW_* variables, and the API is started with synthetic seed data.
=======
#
# Database ports are published to 127.0.0.1 only. Binding to localhost keeps
# the dev and test Postgres instances reachable from the host (for psql, the
# test suite, etc.) without exposing them to the local network — important on
# shared CI machines and developer laptops that may be on untrusted networks.

# Image pinning policy: every base image below is pinned to an exact patch
# version (never a floating tag like `latest` or a bare major/minor) so that
# every developer and CI run gets byte-identical images. Bumping a pin is done
# through a Dependabot/Renovate PR, which keeps the change reviewable and
# reproducible. Do not replace these with floating tags.
services:
  # ── dev ────────────────────────────────────────────────────────────────────
  postgres:
    profiles: ["dev", "full"]
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stellar_tags
    ports:
      # 127.0.0.1 only: reachable from the host, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume so seed and manual test data survive `docker compose down`
      # and the next `up`. Reset to a clean database with:
      #   docker volume rm postgres_dev_data
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    profiles: ["dev", "full"]
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    profiles: ["dev", "full"]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stellar_tags?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "5000"
      LOG_DIR: /app/logs
    volumes:
      # Keep rotated logs across container restarts. The transports cap the
      # volume's growth by rotating daily / at 20MB and pruning old archives.
      - backendlogs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Only in full, not dev: the Vite build is the slowest thing here and backend
  # work does not need it. full is dev plus this.
  frontend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_BASE: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── test ───────────────────────────────────────────────────────────────────
  postgres-test:
    profiles: ["test"]
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stellar_tags_test
    # 5433 on the host so a dev postgres can stay up on 5432. Bound to
    # 127.0.0.1 so the test database is not reachable from the network.
    ports:
      - "127.0.0.1:5433:5432"
    # No volume: a test database should start empty every time.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-test:
    profiles: ["test"]
    build:
      context: ./stellar-payment-platform
      dockerfile: Dockerfile.test
    environment:
      PORT: "5001"
      DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/stellar_tags_test?schema=public
      # The seed script is idempotent: it upserts the same API keys on every
      # run, so the active key below is stable across restarts and re-seeds.
      # Tests read this to make authenticated requests.
      TEST_ADMIN_API_KEY: test-admin-api-key
    ports:
      - "5001:5001"
    # Migrate, then seed (idempotent), then start the server. The seed runs
    # after migrations so the API key tables exist, and re-running it produces
    # the same keys rather than duplicates.
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run db:seed &&
             npm start"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── preview ────────────────────────────────────────────────────────────────
  # Ephemeral per-PR stack. No host port bindings: the preview workflow reaches
  # these services over the project-scoped network only, so two previews (or a
  # preview and dev) never fight over a port. Volumes are named per project via
  # COMPOSE_PROJECT_NAME, so `down -v` on one PR cannot touch another's data.
  postgres-preview:
    profiles: ["preview"]
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: preview
      # Preview-only credential, supplied by the workflow. Never a production
      # secret; the stack is disposable and network-isolated.
      POSTGRES_PASSWORD: ${PREVIEW_DB_PASSWORD:-preview}
      POSTGRES_DB: stellar_tags_preview
    volumes:
      # Project-scoped volume: removed by `down -v` during teardown.
      - postgres_preview_data:/var/lib/postgresql/data
    labels:
      # Lets the TTL sweep find stale preview stacks by creation time.
      com.stellar-tags.preview: "true"
      com.stellar-tags.preview.created-at: "${PREVIEW_CREATED_AT:-unknown}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preview"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-preview:
    profiles: ["preview"]
    image: redis:7.4.2-alpine
    volumes:
      - redis_preview_data:/data
    labels:
      com.stellar-tags.preview: "true"
      com.stellar-tags.preview.created-at: "${PREVIEW_CREATED_AT:-unknown}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-preview:
    profiles: ["preview"]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      # Preview-only wiring. No production credentials are referenced here.
      DATABASE_URL: postgresql://preview:${PREVIEW_DB_PASSWORD:-preview}@postgres-preview:5432/stellar_tags_preview?schema=public
      REDIS_URL: redis://redis-preview:6379
      PORT: "5000"
      LOG_DIR: /app/logs
      # Marks the process as a preview so it refuses to talk to real networks
      # and seeds synthetic data instead.
      PREVIEW_MODE: "true"
      PREVIEW_PR_NUMBER: ${PREVIEW_PR_NUMBER:-0}
    volumes:
      - backend_preview_logs:/app/logs
    labels:
      com.stellar-tags.preview: "true"
      com.stellar-tags.preview.created-at: "${PREVIEW_CREATED_AT:-unknown}"
    depends_on:
      postgres-preview:
        condition: service_healthy
      redis-preview:
        condition: service_healthy

  # ── integration ────────────────────────────────────────────────────────────
  # Standalone Stellar network (Soroban-enabled) used by the contract
  # integration tests. Exposes both the Horizon REST API (8000) and the
  # Soroban RPC endpoint (8000/rpc) so the Rust SDK can submit real
  # transactions against a local network. Kept out of the test profile
  # because it pulls a multi-gigabyte image the API tests never touch.
  stellar-standalone:
    profiles: ["integration"]
    image: stellar/quickstart:v429
    command: [
      "--standalone",
      "--enable-soroban-rpc",
      "--enable-core-artifacts",
      "--local",
    ]
    environment:
      ENABLE_LOGS: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  # Dev-profile Postgres data. Persists across down/up; remove it to start fresh.
  postgres_dev_data:
  backendlogs:
  # Preview-profile volumes. Namespaced by COMPOSE_PROJECT_NAME, so each PR gets
  # its own copies; `down -v` during teardown removes them.
  postgres_preview_data:
  redis_preview_data:
  backend_preview_logs:
