[package]
name = "payment_router"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "20.0.0"
derive_arbitrary = "=1.3.2"

[patch.crates-io]
ethnum = { path = "ethnum-patch" }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
arbitrary = "=1.3.2"
derive_arbitrary = "=1.3.2"
proptest = "1.5.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[package.metadata]
strict-clippy = true
clippy-note = "CI enforces 'cargo clippy --all-targets --all-features -- -D warnings'"

[package.metadata.sbom]
# SBOM generation metadata for the Rust contract artifact.
# Consumed by the release SBOM step to produce a consistent inventory
# tied to the source revision and the optimized WASM artifact digest.
format = "CycloneDX"
spec-version = "1.5"
tool = "cargo-cyclonedx"
tool-version = "0.5"
artifact = "payment_router.wasm"
artifact-path = "target/wasm32-unknown-unknown/release/payment_router.wasm"
digest-algorithm = "sha256"
digest-field = "artifact-digest"
digest-scope = "optimized-wasm"
source-revision-field = "source-revision"
output = "payment_router.cdx.json"