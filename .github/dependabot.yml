version: 2
updates:
  # Keep pinned Docker base images in docker-compose.yml up to date.
  # See the pinning policy comment in docker-compose.yml for rationale.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "infra"
    reviewers:
      - "maintainers"
    # Group patch/minor bumps so a single PR keeps the pins current.
    groups:
      docker-base-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions pinned to immutable commit SHAs up to date.
  # Dependabot rewrites the SHA and preserves/updates the trailing
  # "# vX.Y.Z" version comment so pins stay readable and reviewable.
  # See the pinning policy in .github/workflows/ for rationale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "maintainers"
    # Group patch/minor bumps so a single PR keeps the pins current.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"