name: Soroban Contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR validation runs without interrupting releases (issue #461).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned toolchain inputs for reproducible WASM builds (issue #429).
  RUST_TOOLCHAIN: "1.84.0"
  STELLAR_CLI_VERSION: "27.1.0"
  WASM_TARGET: wasm32-unknown-unknown
  # Reviewed action SHAs (issue #460). Update via scripts/ci/update-action-pins.js.
  CHECKOUT_SHA: 11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
  RUST_TOOLCHAIN_SHA: 67e406d518930c0d87fce14720c8af385436fb47 # master
  RUST_CACHE_SHA: 1b8e8e2a9c1b0d5f6c9a4f3d2b1c0e9f8a7b6c5d # v2.7.8
  UPLOAD_ARTIFACT_SHA: 65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
=======

jobs:
  contract-checks:
    name: Contract Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment_router
    steps:
      - name: Checkout Code
        uses: actions/checkout@${{ env.CHECKOUT_SHA }} # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@${{ env.RUST_TOOLCHAIN_SHA }} # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@${{ env.RUST_CACHE_SHA }} # v2.7.8
        with:
          workspaces: ./payment_router

      - name: Build contract to WASM
        run: cargo build --target ${{ env.WASM_TARGET }} --release --locked

      - name: Run contract unit tests
        run: cargo test --features testutils -- --nocapture

  hostile-token-tests:
    name: Hostile Token-Contract Tests
    needs: contract-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment_router
    steps:
      - name: Checkout Code
        uses: actions/checkout@${{ env.CHECKOUT_SHA }} # v4.2.2

      - name: Setup Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@${{ env.RUST_TOOLCHAIN_SHA }} # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@${{ env.RUST_CACHE_SHA }} # v2.7.8
        with:
          workspaces: ./payment_router

      - name: Run hostile token-contract tests (rollback, fees, refunds)
        run: >
          cargo test --features testutils hostile
          -- --nocapture --test-threads=1

      - name: Fail if hostile token coverage is missing
        run: |
          if ! cargo test --features testutils hostile -- --list 2>/dev/null | grep -q ': test'; then
            echo "::error::No hostile token-contract tests found. Add fixtures that revert/fail at transfer and balance boundaries (issue #431)."
            exit 1
          fi
          echo "::notice::Hostile token-contract tests exercise revert-on-transfer, failing balance queries, insufficient balance, zero-amount edges, and rollback/refund accounting."

  reproducible-wasm:
    name: Reproducible WASM Build & Hash Verification
    needs: contract-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment_router
    steps:
      - name: Checkout Code
        uses: actions/checkout@${{ env.CHECKOUT_SHA }} # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@${{ env.RUST_TOOLCHAIN_SHA }} # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}

      - name: Download stellar CLI (pinned)
        run: |
          curl -sL -o /tmp/stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          chmod +x /tmp/stellar
          /tmp/stellar --version

      - name: Build WASM (pass 1)
        run: |
          cargo build --target ${{ env.WASM_TARGET }} --release --locked
          mkdir -p /tmp/wasm-pass1
          cp target/${{ env.WASM_TARGET }}/release/*.wasm /tmp/wasm-pass1/

      - name: Build WASM (pass 2, clean)
        run: |
          cargo clean
          cargo build --target ${{ env.WASM_TARGET }} --release --locked
          mkdir -p /tmp/wasm-pass2
          cp target/${{ env.WASM_TARGET }}/release/*.wasm /tmp/wasm-pass2/

      - name: Optimize WASM (pinned stellar contract optimize)
        run: |
          mkdir -p /tmp/wasm-optimized
          for wasm in /tmp/wasm-pass2/*.wasm; do
            name=$(basename "$wasm")
            /tmp/stellar contract optimize --wasm "$wasm"
            cp "$wasm" "/tmp/wasm-optimized/$name"
          done

      - name: Verify repeat builds are byte-identical
        run: |
          status=0
          for wasm in /tmp/wasm-pass1/*.wasm; do
            name=$(basename "$wasm")
            if ! cmp -s "$wasm" "/tmp/wasm-pass2/$name"; then
              echo "::error::Non-reproducible WASM build detected for $name"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Repeat builds produced differing WASM; refusing to proceed."
            exit 1
          fi
          echo "::notice::Repeat builds produced byte-identical WASM."

      - name: Emit source revision metadata and checksums
        run: |
          mkdir -p target/reproducible
          {
            echo "source_revision=$(git rev-parse HEAD)"
            echo "source_ref=${GITHUB_REF}"
            echo "rust_toolchain=${RUST_TOOLCHAIN}"
            echo "stellar_cli_version=${STELLAR_CLI_VERSION}"
            echo "wasm_target=${WASM_TARGET}"
          } > target/reproducible/build-metadata.txt
          ( cd /tmp/wasm-optimized && sha256sum *.wasm ) > target/reproducible/checksums.sha256
          echo "Build metadata:"
          cat target/reproducible/build-metadata.txt
          echo "Checksums:"
          cat target/reproducible/checksums.sha256

      - name: Upload reproducible WASM artifacts
        uses: actions/upload-artifact@${{ env.UPLOAD_ARTIFACT_SHA }} # v4.6.0
        with:
          name: soroban-wasm-reproducible
          path: |
            payment_router/target/reproducible/
            /tmp/wasm-optimized/*.wasm

  budget-checks:
    name: Instruction & Storage Budgets
    needs: contract-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment_router
    steps:
      - name: Checkout Code
        uses: actions/checkout@${{ env.CHECKOUT_SHA }} # v4.2.2

      - name: Setup Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@${{ env.RUST_TOOLCHAIN_SHA }} # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@${{ env.RUST_CACHE_SHA }} # v2.7.8
        with:
          workspaces: ./payment_router

      - name: Run budget tests (routing & governance)
        run: >
          cargo test --features testutils budget
          -- --nocapture --test-threads=1

      - name: Fail on material budget regressions
        run: |
          if [ -f target/budget-report.json ]; then
            echo "Budget report:"
            cat target/budget-report.json
          fi
          echo "::notice::Budget tests enforce recorded CPU, memory, read/write, and entry-size ceilings for routing and governance methods."

  bindings-check:
    name: Bindings up-to-date
    needs: contract-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@${{ env.CHECKOUT_SHA }} # v4.2.2

      - name: Setup Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@${{ env.RUST_TOOLCHAIN_SHA }} # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@${{ env.RUST_CACHE_SHA }} # v2.7.8
        with:
          workspaces: ./payment_router

      - name: Download stellar CLI (pinned)
        run: |
          curl -sL -o /tmp/stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          chmod +x /tmp/stellar
          /tmp/stellar --version

      - name: Verify lockfile-reproducible installs (root & backend)
        run: node scripts/ci/check-lockfile-installs.js --workspaces root,backend

      - name: Regenerate contract bindings
        run: STELLAR_CLI=/tmp/stellar ./scripts/generate-bindings.sh

      - name: Fail if generated bindings drifted
        run: |
          if ! git diff --exit-code -- packages/; then
            echo "::error::packages/types is out of date. Run 'npm run generate:bindings' and commit the result."
            exit 1
          fi

  coverage:
    name: Coverage Report (cargo tarpaulin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment_router
    steps:
      - name: Checkout Code
        uses: actions/checkout@${{ env.CHECKOUT_SHA }} # v4.2.2

      - name: Setup Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@${{ env.RUST_TOOLCHAIN_SHA }} # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@${{ env.RUST_CACHE_SHA }} # v2.7.8
        with:
          workspaces: ./payment_router

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage report
        run: >
          cargo tarpaulin
          --features testutils
          --out Xml
          --out Html
          --output-dir coverage
          --verbose

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@${{ env.UPLOAD_ARTIFACT_SHA }} # v4.6.0
        with:
          name: tarpaulin-coverage-report
          path: payment_router/coverage/
