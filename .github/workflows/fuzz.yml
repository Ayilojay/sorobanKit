name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

# Cancel superseded fuzz/property runs for the same workflow and ref so new
# commits don't queue behind obsolete validation. Releases are not produced by
# this workflow, so cancelling in-progress runs is safe here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - route_payment
          - route_batch
          - route_payments
          - refund_lifecycle
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run ${{ matrix.target }} fuzz target
        working-directory: payment_router
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=30

  property:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921 # stable

      - name: Run payment/refund invariant property tests
        working-directory: payment_router
        env:
          # Deterministic, bounded profile for CI: fixed seed, capped iterations/steps.
          PROPTEST_CASES: '256'
          PROPTEST_MAX_LOCAL_REJECTS: '1024'
          PROPTEST_MAX_FLAT_MAP_REGENS: '1024'
          PROPTEST_MAX_SHRINK_ITERS: '4096'
          PROPTEST_RNG_SEED: '0x5eed'
          PROP_MAX_STEPS: '64'
        run: cargo test --locked --test payment_refund_invariants -- --nocapture