name: Testnet CD Pipeline

on:
  push:
    branches: [main]

env:
  # Pinned toolchain inputs for reproducible Soroban WASM builds.
  RUST_TOOLCHAIN: "1.81.0"
  STELLAR_CLI_VERSION: "22.0.1"
  SOROBAN_SDK_VERSION: "22.0.0"
  WASM_ARTIFACT: payment_router.wasm

jobs:
  build-backend-image:
    name: Build Backend Image (once)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.digest.outputs.image_digest }}
      image_ref: ${{ steps.digest.outputs.image_ref }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tag by commit SHA only; promotion is by digest, never by tag.
          tags: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: true
          sbom: true

      - name: Record immutable image digest
        id: digest
        run: |
          IMAGE_REF="${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/backend"
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "::error::Build did not produce an image digest."
            exit 1
          fi
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "### 🧱 Backend image built once" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image**: \`${IMAGE_REF}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-digest
          path: |
            ${{ steps.build.outputs.digest }}
          if-no-files-found: ignore

  deploy-testnet:
    name: Deploy to Testnet
    needs: build-backend-image
    runs-on: ubuntu-latest
    # Manual approval gate: requires a reviewer configured on the `testnet`
    # environment in repository settings before any deploy steps run.
    environment: testnet
    defaults:
      run:
        working-directory: ./payment_router
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./payment_router

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"

      - name: Verify pinned Soroban SDK version
        run: |
          if ! grep -Eq 'soroban-sdk[^=]*=\s*\{[^}]*version\s*=\s*"=?${SOROBAN_SDK_VERSION}"' Cargo.toml; then
            echo "::error::Cargo.toml does not pin soroban-sdk to ${SOROBAN_SDK_VERSION}; reproducible builds require a pinned SDK."
            exit 1
          fi

      - name: Build contract to WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Optimize WASM
        run: |
          stellar contract optimize \
            --wasm target/wasm32-unknown-unknown/release/payment_router.wasm

      - name: Emit source revision metadata and checksums
        run: |
          mkdir -p target/reproducible
          OPTIMIZED=target/wasm32-unknown-unknown/release/payment_router.optimized.wasm
          cp "$OPTIMIZED" "target/reproducible/${WASM_ARTIFACT}"
          SHA256=$(sha256sum "target/reproducible/${WASM_ARTIFACT}" | awk '{print $1}')
          cat > target/reproducible/build-metadata.json <<EOF
          {
            "git_commit": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF}",
            "rust_toolchain": "${RUST_TOOLCHAIN}",
            "stellar_cli_version": "${STELLAR_CLI_VERSION}",
            "soroban_sdk_version": "${SOROBAN_SDK_VERSION}",
            "wasm_artifact": "${WASM_ARTIFACT}",
            "sha256": "${SHA256}"
          }
          EOF
          echo "${SHA256}  ${WASM_ARTIFACT}" > target/reproducible/${WASM_ARTIFACT}.sha256
          cat target/reproducible/build-metadata.json

      - name: Verify reproducible build (byte-identical WASM)
        run: |
          FIRST_SHA=$(sha256sum "target/reproducible/${WASM_ARTIFACT}" | awk '{print $1}')
          cargo clean
          cargo build --target wasm32-unknown-unknown --release
          stellar contract optimize \
            --wasm target/wasm32-unknown-unknown/release/payment_router.wasm
          SECOND_SHA=$(sha256sum "target/wasm32-unknown-unknown/release/payment_router.optimized.wasm" | awk '{print $1}')
          echo "First build sha256:  $FIRST_SHA"
          echo "Second build sha256: $SECOND_SHA"
          if [ "$FIRST_SHA" != "$SECOND_SHA" ]; then
            echo "::error::Reproducible build check failed: WASM hashes differ between builds."
            exit 1
          fi
          echo "✅ Repeat builds produced byte-identical WASM ($FIRST_SHA)."

      - name: Upload reproducible WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payment-router-wasm
          path: |
            payment_router/target/reproducible/payment_router.wasm
            payment_router/target/reproducible/payment_router.wasm.sha256
            payment_router/target/reproducible/build-metadata.json

      - name: Release manifest preflight
        env:
          RELEASE_MANIFEST: ${{ vars.RELEASE_MANIFEST || 'release-manifest.json' }}
        run: |
          # Reject mismatched dashboard/client/contract combinations before deploy.
          if [ ! -f "$RELEASE_MANIFEST" ]; then
            echo "::error::Release manifest '$RELEASE_MANIFEST' not found; refusing to deploy."
            exit 1
          fi
          WASM_SHA=$(awk '{print $1}' target/reproducible/${WASM_ARTIFACT}.sha256)
          MANIFEST_WASM_HASH=$(jq -r '.wasm_hash // empty' "$RELEASE_MANIFEST")
          if [ -z "$MANIFEST_WASM_HASH" ]; then
            echo "::error::Release manifest is missing required field 'wasm_hash'."
            exit 1
          fi
          if [ "$MANIFEST_WASM_HASH" != "$WASM_SHA" ]; then
            echo "::error::Release manifest wasm_hash ($MANIFEST_WASM_HASH) does not match built WASM ($WASM_SHA)."
            exit 1
          fi
          for FIELD in api_version contract_version interface_schema migration_level supported_networks; do
            if ! jq -e --arg f "$FIELD" 'has($f)' "$RELEASE_MANIFEST" >/dev/null; then
              echo "::error::Release manifest is missing required field '$FIELD'."
              exit 1
            fi
          done
          if ! jq -e '.supported_networks | index("testnet") != null' "$RELEASE_MANIFEST" >/dev/null; then
            echo "::error::Release manifest does not declare support for 'testnet'."
            exit 1
          fi
          echo "✅ Release manifest preflight passed (wasm_hash=$WASM_SHA)."

      - name: Deploy to Testnet
        id: deploy
        env:
          BACKEND_IMAGE_REF: ${{ needs.build-backend-image.outputs.image_ref }}
          BACKEND_IMAGE_DIGEST: ${{ needs.build-backend-image.outputs.image_digest }}
        run: |
          # Generate deployer keypair
          stellar keys generate deployer --network testnet
          
          # Fund the deployer account
          stellar keys fund deployer --network testnet
          
          # Deploy contract
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/reproducible/payment_router.wasm \
            --source deployer \
            --network testnet)

          # Deployment identity: unique ID ties every artifact to this rollout.
          DEPLOYMENT_ID="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "$CONTRACT_ID" > target/reproducible/contract-id.txt

          # Output to GitHub Step Summary
          echo "### 🚀 Output from Testnet Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment ID**: \`$DEPLOYMENT_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "**Contract ID**: \`$CONTRACT_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "**WASM sha256**: \`$(cat target/reproducible/payment_router.wasm.sha256 | awk '{print $1}')\`" >> $GITHUB_STEP_SUMMARY
          echo "**Backend image**: \`${BACKEND_IMAGE_REF:-unset}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Backend digest**: \`${BACKEND_IMAGE_DIGEST:-unset}\`" >> $GITHUB_STEP_SUMMARY

      - name: Post-Deploy Health Check
        env:
          TESTNET_API_URL: ${{ secrets.TESTNET_API_URL }}
        run: |
          if [ -z "$TESTNET_API_URL" ]; then
            echo "::error::TESTNET_API_URL repository secret is not configured."
            exit 1
          fi

          HEALTH_URL="${TESTNET_API_URL%/}/health"
          RESPONSE_FILE=$(mktemp)

          HTTP_STATUS=$(curl --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output "$RESPONSE_FILE" --write-out "%{http_code}" \
            "$HEALTH_URL")

          BODY=$(cat "$RESPONSE_FILE")
          rm -f "$RESPONSE_FILE"

          echo "Health check HTTP status: $HTTP_STATUS"
          echo "Health check response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Post-deploy health check failed: expected HTTP 200, got $HTTP_STATUS"
            exit 1
          fi

          if ! echo "$BODY" | jq -e '(.status | type == "string") and ((.status | ascii_downcase) == "up")' >/dev/null; then
            echo "::error::Post-deploy health check failed: expected status 'up' in response body"
            exit 1
          fi

          echo "✅ Testnet API is live and healthy (status: up)."

      - name: Post-deploy on-chain smoke checks
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          BACKEND_IMAGE_DIGEST: ${{ needs.build-backend-image.outputs.image_digest }}
        run: |
          # Verify on-chain WASM hash, network, admin state, and read interface.
          # Uses bounded, non-duplicating test transactions (read-only calls only).
          EXPECTED_WASM_SHA=$(awk '{print $1}' target/reproducible/${WASM_ARTIFACT}.sha256)
          RESULTS_FILE="target/reproducible/smoke-results-${DEPLOYMENT_ID}.json"
          FAILURES=0

          record() {
            local check="$1" status="$2" detail="$3"
            jq -n --arg id "$DEPLOYMENT_ID" --arg check "$check" \
              --arg status "$status" --arg detail "$detail" \
              '{deployment_id: $id, check: $check, status: $status, detail: $detail}' \
              >> "$RESULTS_FILE"
          }

          : > "$RESULTS_FILE"

          # 1. Network identity
          NETWORK_PASSPHRASE=$(stellar network passphrase --network testnet 2>/dev/null || true)
          if echo "$NETWORK_PASSPHRASE" | grep -q "Test SDF Network"; then
            record "network" "pass" "testnet"
          else
            record "network" "fail" "unexpected network passphrase"
            FAILURES=$((FAILURES + 1))
          fi

          # 2. On-chain WASM hash matches the built artifact
          ONCHAIN_WASM=$(stellar contract fetch \
            --id "$CONTRACT_ID" --network testnet 2>/dev/null | sha256sum | awk '{print $1}' || true)
          if [ "$ONCHAIN_WASM" = "$EXPECTED_WASM_SHA" ]; then
            record "wasm_hash" "pass" "$ONCHAIN_WASM"
          else
            record "wasm_hash" "fail" "expected $EXPECTED_WASM_SHA got ${ONCHAIN_WASM:-none}"
            FAILURES=$((FAILURES + 1))
          fi

          # 3. Admin state is set (read-only invocation)
          ADMIN=$(stellar contract invoke \
            --id "$CONTRACT_ID" --network testnet --source deployer \
            -- get_admin 2>/dev/null || true)
          if [ -n "$ADMIN" ]; then
            record "admin_state" "pass" "admin configured"
          else
            record "admin_state" "fail" "admin not readable"
            FAILURES=$((FAILURES + 1))
          fi

          # 4. Read interface responds (bounded, single read call)
          if stellar contract invoke \
            --id "$CONTRACT_ID" --network testnet --source deployer \
            -- get_version >/dev/null 2>&1; then
            record "read_interface" "pass" "get_version ok"
          else
            record "read_interface" "fail" "get_version failed"
            FAILURES=$((FAILURES + 1))
          fi

          echo "### 🔎 Post-deploy smoke checks (deployment \`$DEPLOYMENT_ID\`)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"| \(.check) | \(.status) | \(.detail) |"' "$RESULTS_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "**Backend digest**: \`${BACKEND_IMAGE_DIGEST:-unset}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILURES" -ne 0 ]; then
            echo "::error::Post-deploy smoke checks failed ($FAILURES failure(s)); see $RESULTS_FILE"
            exit 1
          fi
          echo "✅ All post-deploy smoke checks passed for deployment $DEPLOYMENT_ID."

      - name: Upload smoke check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ steps.deploy.outputs.deployment_id }}
          path: payment_router/target/reproducible/smoke-results-*.json
          if-no-files-found: warn
