name: CI / Docs Spellcheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck:
    name: Docs Spellcheck (push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run CSpell on Documentation
        uses: streetsidesoftware/cspell-action@e46dc6c8f4a6b9e6c8f4e0e0e0e0e0e0e0e0e0e0 # v5.0.0
        with:
          # Only scan markdown files (you can add .txt or other extensions here)
          files: '**/*.md'
          # Force the workflow to fail if spelling errors are found
          strict: true
          # Show the surrounding text where the spelling error occurred
          inline: warning