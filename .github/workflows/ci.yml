name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check per-route bundle budgets
        run: npm run test:budget
      - run: npm run lint
      - run: npm run typecheck

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run visual regression tests
        run: npm run test:visual
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  abi-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build WASM artifact
        run: npm run build:wasm
      - name: Generate TypeScript bindings from compiled WASM
        run: npm run bindings:generate -- --out .abi/generated
      - name: Compare generated bindings against checked-in output
        run: npm run bindings:check -- --generated .abi/generated --checked-in src/bindings
      - name: Compile and decode consumer fixture
        run: npm run test:abi-fixture
      - name: Run ABI compatibility tests
        run: npm run test:abi