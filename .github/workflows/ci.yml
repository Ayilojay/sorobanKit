name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify lockfile-reproducible installs
        run: node scripts/ci/check-lockfile-installs.js
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck

  abi-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify lockfile-reproducible installs
        run: node scripts/ci/check-lockfile-installs.js
      - name: Build WASM artifact
        run: npm run build:wasm
      - name: Generate TypeScript bindings from compiled WASM
        run: npm run bindings:generate -- --out .abi/generated
      - name: Compare generated bindings against checked-in output
        run: npm run bindings:check -- --generated .abi/generated --checked-in src/bindings
      - name: Compile and decode consumer fixture
        run: npm run test:abi-fixture
      - name: Run ABI compatibility tests
        run: npm run test:abi