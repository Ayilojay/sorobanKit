name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck

  abi-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build WASM artifact
        run: npm run build:wasm
      - name: Generate TypeScript bindings from compiled WASM
        run: npm run bindings:generate -- --out .abi/generated
      - name: Compare generated bindings against checked-in output
        run: npm run bindings:check -- --generated .abi/generated --checked-in src/bindings
      - name: Compile and decode consumer fixture
        run: npm run test:abi-fixture
      - name: Run ABI compatibility tests
        run: npm run test:abi

  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build candidate server
        run: npm run build
      - name: Run API backward-compatibility suite against candidate server
        run: npm run test:api-compat -- --report .api-compat/report.json
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-compat-report
          path: .api-compat/report.json
          if-no-files-found: ignore