name: Integration Tests

on:
  pull_request:
    paths:
      - 'payment_router/src/**'
      - 'tests/e2e/**'
      - 'tests/integration/**'
      - '.github/workflows/integration-tests.yml'

jobs:
  changes:
    name: Detect Changed Workspaces
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.detect.outputs.integration }}
      e2e: ${{ steps.detect.outputs.e2e }}
      full_suite: ${{ steps.detect.outputs.full_suite }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed workspaces and dependency fan-out
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Full-suite fallback when the diff cannot be computed reliably.
          full_suite=false
          integration=false
          e2e=false

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "Missing base/head SHA; falling back to full suite" >&2
            full_suite=true
          elif ! git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            echo "Unable to fetch base SHA; falling back to full suite" >&2
            full_suite=true
          else
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
            if [ -z "$changed" ]; then
              echo "No changed files detected; falling back to full suite" >&2
              full_suite=true
            fi
          fi

          if [ "$full_suite" = "true" ]; then
            integration=true
            e2e=true
          else
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                # Root configuration, lockfiles, and shared schemas/bindings fan out to everything.
                package.json|package-lock.json|npm-shrinkwrap.json|yarn.lock|pnpm-lock.yaml|tsconfig*.json|jest.config*|docker-compose*.yml|docker-compose*.yaml|Dockerfile*|.github/workflows/*)
                  full_suite=true
                  integration=true
                  e2e=true
                  ;;
                # Shared schemas and generated bindings fan out to all dependent workspaces.
                schemas/*|bindings/*|packages/schemas/*|packages/bindings/*|shared/*)
                  integration=true
                  e2e=true
                  ;;
                # Integration workspace and its dependencies.
                payment_router/src/*|payment_router/Cargo.toml|payment_router/Cargo.lock|tests/integration/*)
                  integration=true
                  ;;
                # E2E workspace and its dependencies.
                tests/e2e/*|src/*|api/*|server/*)
                  e2e=true
                  ;;
              esac
            done <<< "$changed"
          fi

          echo "integration=$integration" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "full_suite=$full_suite" >> "$GITHUB_OUTPUT"

  integration-tests:
    name: Soroban Integration Tests
    needs: changes
    if: needs.changes.outputs.integration == 'true' || needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start local Stellar network
        run: docker compose --profile integration up -d

      - name: Wait for Stellar network to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/soroban/rpc -X POST \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' > /dev/null; then
              echo "Stellar network is ready"
              exit 0
            fi
            echo "Waiting for Stellar network... ($i/60)"
            sleep 5
          done
          echo "Timed out waiting for Stellar network" >&2
          exit 1

      - name: Run integration tests
        run: |
          chmod +x tests/integration/run.sh
          tests/integration/run.sh

      - name: Stop local Stellar network
        if: always()
        run: docker compose --profile integration down -v

  e2e-tests:
    name: End-to-End Flow Tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start local dev stack
        run: docker compose --profile dev up -d --build

      - name: Wait for dev stack to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Dev stack is ready"
              exit 0
            fi
            echo "Waiting for dev stack... ($i/60)"
            sleep 5
          done
          echo "Timed out waiting for dev stack" >&2
          docker compose --profile dev logs
          exit 1

      - name: Run full-flow e2e suite
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_FEDERATION_URL: http://localhost:3000/federation
          E2E_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
        run: npx jest tests/e2e/full-flow.e2e.test.js --runInBand --forceExit

      - name: Run remaining e2e suites
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_FEDERATION_URL: http://localhost:3000/federation
          E2E_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
        run: npx jest tests/e2e --runInBand --forceExit

      - name: Dump dev stack logs on failure
        if: failure()
        run: docker compose --profile dev logs

      - name: Stop local dev stack
        if: always()
        run: docker compose --profile dev down -v