name: CI Build

on:
  push:
    branches: [feat/autofocus-input]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd payment-dashboard
          npm install --legacy-peer-deps

      - name: Typecheck
        run: |
          cd payment-dashboard
          npm run typecheck

      - name: Build
        run: |
          cd payment-dashboard
          npm run build

  build-once:
    # Build the immutable backend artifact exactly once. Downstream staging and
    # production promotion jobs consume the recorded digest instead of
    # rebuilding, so the same bytes are promoted across environments.
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image-digest: ${{ steps.digest.outputs.digest }}
      image-ref: ${{ steps.digest.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image reference
        id: image
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/payment-dashboard-backend"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build backend image (no push)
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ./payment-dashboard
          file: ./payment-dashboard/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record image digest
        id: digest
        run: |
          IMAGE="${{ steps.image.outputs.image }}:${{ github.sha }}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" 2>/dev/null || true)"
          if [ -z "$DIGEST" ]; then
            # Local (unpushed) images have no RepoDigests; derive the content
            # digest from the image ID so downstream promotion can pin it.
            IMAGE_ID="$(docker inspect --format='{{.Id}}' "$IMAGE")"
            DIGEST="${IMAGE}@${IMAGE_ID}"
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image-ref=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Recorded backend artifact digest: ${DIGEST}"

      - name: Write digest artifact
        run: |
          mkdir -p dist
          {
            echo "image-ref=${{ steps.digest.outputs.image-ref }}"
            echo "digest=${{ steps.digest.outputs.digest }}"
            echo "revision=${{ github.sha }}"
          } > dist/backend-image-digest.txt
          cat dist/backend-image-digest.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-digest
          path: dist/backend-image-digest.txt
          retention-days: 30